services:
  transactional:
    image: postgres:12
    environment:
      POSTGRES_DB: dvdrental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${TRANSACTIONAL_DB_PASSWORD:?Configure TRANSACTIONAL_DB_PASSWORD no .env}"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./data/dvdrental.sql:/docker-entrypoint-initdb.d/dvdrental.sql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "dvdrental"]
      interval: 5s
      timeout: 3s
      retries: 12

  analytics:
    image: postgres:12
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${ANALYTICS_DB_PASSWORD:?Configure ANALYTICS_DB_PASSWORD no .env}"
    ports:
      - 5440:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "analytics"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
    postgres:
